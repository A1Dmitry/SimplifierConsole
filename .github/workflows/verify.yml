name: Verify .NET console

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout required Ricis.Core dependency
        uses: actions/checkout@v4
        with:
          repository: A1Dmitry/Ricis.Core
          ref: bdc03b6b78c785c6ceaa9063978bd952b50e5326
          path: ../Ricis.Core
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore standalone project
        run: dotnet restore SimplifierConsole.csproj

      - name: Build standalone project
        run: dotnet build SimplifierConsole.csproj --configuration Release --no-restore
